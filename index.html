<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho HC-06 - Controle Analógico Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .btn-conectar {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
            width: 200px;
        }

        .btn-conectar.conectado {
            background-color: #dc2626;
        }

        #status {
            color: #f87171;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #status.conectado {
            color: #4ade80;
        }

        /* Área do Analógico Virtual */
        .container-analogico {
            position: relative;
            width: 160px;
            height: 160px;
            background-color: #1f2937;
            border: 3px solid #374151;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            touch-action: none;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4);
        }

        .stick {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-weight: bold;
        }

        .painel-botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-acao {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-acao:active {
            filter: brightness(1.2);
        }

        .instrucoes {
            text-align: center;
            color: #9ca3af;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>CARRINHO HC-06</h1>

    <button id="btnConectar" class="btn-conectar">CONECTAR</button>
    <div id="status">Desconectado</div>

    <!-- Analógico Virtual -->
    <div class="container-analogico" id="baseAnalogico">
        <div class="stick" id="stick">▲</div>
    </div>

    <div class="painel-botoes">
        <button class="btn-acao" id="btnParar">PARAR (S)</button>
    </div>

    <div class="instrucoes">
        Arrasta o analógico ou usa W A S D / Setas<br>
        Espaço = Parar total
    </div>

    <script>
        let bluetoothDevice = null;
        let gattCharacteristic = null;
        let comandoAtual = "S";
        let teclasPressionadas = new Set();
        let origemAnalogico = false;
        let intervalLoop = null;

        const btnConectar = document.getElementById("btnConectar");
        const elStatus = document.getElementById("status");
        const baseAnalogico = document.getElementById("baseAnalogico");
        const stick = document.getElementById("stick");
        const btnParar = document.getElementById("btnParar");

        const mapaTeclas = {
            "w": "F", "arrowup": "F",
            "s": "B", "arrowdown": "B",
            "a": "L", "arrowleft": "L",
            "d": "R", "arrowright": "R"
        };

        // Bluetooth Connect/Disconnect
        btnConectar.addEventListener("click", async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                desconectar();
            } else {
                await conectar();
            }
        });

        async function conectar() {
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', desconectar);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('00001101-0000-1000-8000-00805f9b34fb');
                const characteristics = await service.getCharacteristics();
                gattCharacteristic = characteristics[0];

                elStatus.textContent = "Conectado";
                elStatus.classList.add("conectado");
                btnConectar.textContent = "DESCONECTAR";
                btnConectar.classList.add("conectado");

                if (!intervalLoop) {
                    intervalLoop = setInterval(cicloEnvio, 100);
                }

                enviarComando("S");
            } catch (error) {
                console.error("Erro Bluetooth:", error);
                alert("Não foi possível conectar: " + error.message);
                desconectar();
            }
        }

        function desconectar() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                try {
                    enviarComando("S");
                    bluetoothDevice.gatt.disconnect();
                } catch (e) {}
            }

            if (intervalLoop) {
                clearInterval(intervalLoop);
                intervalLoop = null;
            }

            bluetoothDevice = null;
            gattCharacteristic = null;
            comandoAtual = "S";
            teclasPressionadas.clear();
            resetarStick();

            elStatus.textContent = "Desconectado";
            elStatus.classList.remove("conectado");
            btnConectar.textContent = "CONECTAR";
            btnConectar.classList.remove("conectado");
        }

        async function enviarComando(c) {
            if (!gattCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await gattCharacteristic.writeValue(encoder.encode(c));
            } catch (error) {
                console.error("Erro no envio:", error);
                desconectar();
            }
        }

        function atualizarComando() {
            let novoComando = "S";

            if (origemAnalogico) {
                // Comando já definido pelo analógico
                return;
            } else if (teclasPressionadas.size > 0) {
                const ultimaTecla = Array.from(teclasPressionadas).pop();
                novoComando = mapaTeclas[ultimaTecla] || "S";
            }

            if (novoComando !== comandoAtual) {
                comandoAtual = novoComando;
                enviarComando(novoComando);
            }
        }

        // --- LÓGICA DO ANALÓGICO VIRTUAL ---
        const raioMax = 45; // Distância máxima que o botão móvel pode afastar do centro

        function processarMovimentoStick(clientX, clientY) {
            const rect = baseAnalogico.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;

            let deltaX = clientX - centroX;
            let deltaY = clientY - centroY;
            let distancia = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (distancia > raioMax) {
                deltaX = (deltaX / distancia) * raioMax;
                deltaY = (deltaY / distancia) * raioMax;
                distancia = raioMax;
            }

            // Move visualmente o stick
            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Zona morta para considerar Parado
            if (distancia < 15) {
                comandoAtual = "S";
                stick.textContent = "•";
                return;
            }

            // Cálculo do ângulo em graus (0 a 360)
            let angulo = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            if (angulo < 0) angulo += 360;

            // Determinar Direção com base nos quadrantes
            let novoCmd = "S";
            if (angulo >= 45 && angulo < 135) {
                novoCmd = "B"; // Baixo / Ré
                stick.textContent = "▼";
            } else if (angulo >= 135 && angulo < 225) {
                novoCmd = "L"; // Esquerda
                stick.textContent = "◀";
            } else if (angulo >= 225 && angulo < 315) {
                novoCmd = "F"; // Frente
                stick.textContent = "▲";
            } else {
                novoCmd = "R"; // Direita
                stick.textContent = "▶";
            }

            if (novoCmd !== comandoAtual) {
                comandoAtual = novoCmd;
                enviarComando(novoCmd);
            }
        }

        function resetarStick() {
            origemAnalogico = false;
            stick.style.transform = `translate(0px, 0px)`;
            stick.textContent = "▲";
            comandoAtual = "S";
            enviarComando("S");
        }

        // Eventos do Analógico (Rato e Touch)
        baseAnalogico.addEventListener("pointerdown", (e) => {
            origemAnalogico = true;
            baseAnalogico.setPointerCapture(e.pointerId);
            processarMovimentoStick(e.clientX, e.clientY);
        });

        baseAnalogico.addEventListener("pointermove", (e) => {
            if (!origemAnalogico) return;
            processarMovimentoStick(e.clientX, e.clientY);
        });

        baseAnalogico.addEventListener("pointerup", (e) => {
            if (!origemAnalogico) return;
            resetarStick();
        });

        // Eventos de Teclado
        window.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            if (key === " ") {
                e.preventDefault();
                pararTudo();
                return;
            }
            if (mapaTeclas[key] && !teclasPressionadas.has(key)) {
                teclasPressionadas.add(key);
                origemAnalogico = false; // Teclado sobrepõe analógico
                stick.style.transform = `translate(0px, 0px)`;
                atualizarComando();
            }
        });

        window.addEventListener("keyup", (e) => {
            const key = e.key.toLowerCase();
            if (teclasPressionadas.has(key)) {
                teclasPressionadas.delete(key);
                atualizarComando();
            }
        });

        btnParar.addEventListener("click", pararTudo);

        function pararTudo() {
            teclasPressionadas.clear();
            resetarStick();
        }

        function cicloEnvio() {
            if (gattCharacteristic && bluetoothDevice?.gatt.connected) {
                enviarComando(comandoAtual);
            }
        }
    </script>
</body>
</html>
